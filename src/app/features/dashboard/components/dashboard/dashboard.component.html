<div class="mb-3">
  <h4 class="fw-bold">Dashboard</h4>
</div>

<div class="row">
  <div class="col-md-3">
    <app-summary-card title="Total Users" [value]="userCount"></app-summary-card>
  </div>
  <div class="col-md-3">
    <app-summary-card title="Total Products" [value]="productCount != null ? productCount : 'N/A'"></app-summary-card>
  </div>
  <div class="col-md-3">
    <app-summary-card title="Revenue" [value]="revenue ? (revenue | currency) : 'N/A'"></app-summary-card>
  </div>
  <div class="col-md-3">
    <app-summary-card title="New Orders" [value]="'125'"></app-summary-card>
  </div>
</div>
<div class="mt-4">
  <h5>Recent Activity</h5>
  <ul class="list-group">
    <li *ngFor="let activity of activityFeed" class="list-group-item">{{ activity }}</li>
  </ul>
</div>
