<div class="mb-3">
  <h4 class="fw-bold">Users</h4>
</div>

<div class="row mb-3">
  <div class="col">
    <input
      class="form-control"
      [(ngModel)]="searchTerm"
      (input)="applyFilter()"
      placeholder="Search users..."
    />
  </div>
  <div class="col">
    <select
      class="form-select"
      [(ngModel)]="selectedRole"
      (change)="applyFilter()"
    >
      <option value="">All Roles</option>
      <option value="admin">Admin</option>
      <option value="user">User</option>
      <option value="guest">Guest</option>
    </select>
  </div>
</div>
<table class="table table-striped">
  <thead>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Role</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let user of pagedUsers">
      <td>{{ user.name }}</td>
      <td>{{ user.email }}</td>
      <td>{{ user.role }}</td>
      <td>
        <button
          class="btn btn-sm btn-primary me-2"
          (click)="openModal('view', user, userModal)"
        >
          View
        </button>
        <button
          class="btn btn-sm btn-primary me-2"
          (click)="openModal('edit', user, userModal)"
        >
          Edit
        </button>
        <button
          class="btn btn-sm btn-danger"
          (click)="openModal('delete', user, userModal)"
        >
          Delete
        </button>
      </td>
    </tr>
  </tbody>
</table>
<nav *ngIf="totalPages > 1" aria-label="User pagination">
  <ul class="pagination justify-content-center">
    <li class="page-item" [class.disabled]="currentPage === 1">
      <button
        class="page-link"
        (click)="goToPage(currentPage - 1)"
        [disabled]="currentPage === 1"
      >
        Previous
      </button>
    </li>
    <li
      class="page-item"
      *ngFor="let page of [].constructor(totalPages); let i = index"
      [class.active]="currentPage === i + 1"
    >
      <button class="page-link" (click)="goToPage(i + 1)">{{ i + 1 }}</button>
    </li>
    <li class="page-item" [class.disabled]="currentPage === totalPages">
      <button
        class="page-link"
        (click)="goToPage(currentPage + 1)"
        [disabled]="currentPage === totalPages"
      >
        Next
      </button>
    </li>
  </ul>
</nav>

<ng-template #userModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title">{{ modalType | titlecase }} User</h5>
    <button
      type="button"
      class="btn-close"
      aria-label="Close"
      (click)="modal.dismiss()"
    ></button>
  </div>
  <div class="modal-body">
    <ng-container [ngSwitch]="modalType">
      <div *ngSwitchCase="'view'">
        <p><strong>Name:</strong> {{ selectedUser?.name }}</p>
        <p><strong>Email:</strong> {{ selectedUser?.email }}</p>
        <p><strong>Role:</strong> {{ selectedUser?.role }}</p>
      </div>
      <div *ngSwitchCase="'edit'">
        <div class="mb-2">
          <label>Name:</label>
          <input class="form-control" [(ngModel)]="selectedUser.name" />
        </div>
        <div class="mb-2">
          <label>Email:</label>
          <input class="form-control" [(ngModel)]="selectedUser.email" />
        </div>
        <div class="mb-2">
          <label>Role:</label>
          <select class="form-select" [(ngModel)]="selectedUser.role">
            <option value="admin">Admin</option>
            <option value="user">User</option>
            <option value="guest">Guest</option>
          </select>
        </div>
      </div>
      <div *ngSwitchCase="'delete'">
        <p>
          Are you sure you want to delete
          <strong>{{ selectedUser?.name }}</strong
          >?
        </p>
      </div>
    </ng-container>
  </div>
  <div class="modal-footer">
    <button class="btn btn-secondary" (click)="modal.dismiss()">Close</button>
    <button
      *ngIf="modalType === 'edit'"
      class="btn btn-primary"
      (click)="saveEdit(); modal.close()"
    >
      Save
    </button>
    <button
      *ngIf="modalType === 'delete'"
      class="btn btn-danger"
      (click)="confirmDelete(); modal.close()"
    >
      Delete
    </button>
  </div>
</ng-template>
