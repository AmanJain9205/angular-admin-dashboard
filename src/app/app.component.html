<button
  class="btn btn-primary"
  style="position: fixed; top: 20px; left: 20px; z-index: 2000"
  *ngIf="!sidebarOpen"
  (click)="sidebarOpen = true"
>
  &#9776;
</button>

<div class="d-flex">
  <nav [class.active]="sidebarOpen" class="sidebar bg-primary">
    <div class="sidebar-header d-flex align-items-center justify-content-center position-relative" style="height: 60px;">
  <a class="navbar-brand text-white m-0">ADMIN</a>
  <button
    class="btn btn-sm btn-light position-absolute end-0 me-2"
    (click)="sidebarOpen = false"
  >
    <span>&#10005;</span>
  </button>
</div>
    <ul class="nav flex-column mt-3">
  <li class="nav-item">
    <a class="nav-link text-white" routerLink="/dashboard" routerLinkActive="active">
      <i class="fas fa-tachometer-alt me-2"></i> Dashboard
    </a>
  </li>
  <li class="nav-item">
    <a class="nav-link text-white" routerLink="/users" routerLinkActive="active">
      <i class="fas fa-users me-2"></i> Users
    </a>
  </li>
  <li class="nav-item">
    <a class="nav-link text-white" routerLink="/products" routerLinkActive="active">
      <i class="fas fa-boxes me-2"></i> Products
    </a>
  </li>
  <li class="nav-item">
    <a class="nav-link text-white" routerLink="/analytics" routerLinkActive="active">
      <i class="fas fa-chart-line me-2"></i> Analytics
    </a>
  </li>
  <li class="nav-item">
    <a class="nav-link text-white" routerLink="/settings" routerLinkActive="active">
      <i class="fas fa-cog me-2"></i> Settings
    </a>
  </li>
</ul>

<div class="sidebar-footer text-center text-white py-2">
  Made with <span style="color: red;">❤️</span> by Aman
</div>


  </nav>
  <div class="flex-grow-1 p-3">
    <router-outlet></router-outlet>
  </div>
</div>
